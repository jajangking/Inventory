<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Inventory — Catatan Barang Pribadi</title>

  <link rel="stylesheet" href="/style.css" />

<body>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/dashboard">

        <rect x="3" y="7" width="18" height="13" rx="2" fill="currentColor" opacity=".9"/>
        <path d="M3 9l9-5 9 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <nav class="mainnav" id="mainnav">

  <main id="app" class="app"></main>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="/app.js"></script>

</html>
